<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#05070d"><title>Daily Progress</title>
<style>
:root{--bg:#05070d;--c:#0e1424;--c2:#151d33;--b:#2f7bff;--n:#4da3ff;--t:#fff;--m:#8b95ab;--g:#22c55e;--o:#f59e0b;--r:#ef4444;--br:rgba(77,163,255,.18);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[data-theme=light]{--bg:#eef2fa;--c:#fff;--c2:#eaeef8;--t:#0b1220;--m:#5b657a;--br:rgba(47,123,255,.22)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--t);font:15px/1.4 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background-image:radial-gradient(600px 300px at 80% -50px,rgba(47,123,255,.22),transparent)}
#app{max-width:560px;margin:0 auto;padding:16px 14px 110px}
h1{margin:0;font-size:26px;letter-spacing:-.5px}h2{font-size:13px;letter-spacing:1.5px;text-transform:uppercase;color:var(--m);margin:22px 4px 10px}small{color:var(--m);display:block}
.card{background:linear-gradient(145deg,rgba(21,29,51,0.92),rgba(14,20,36,0.93));border:1px solid var(--br);border-radius:22px;padding:16px;margin-bottom:12px;backdrop-filter:blur(14px);box-shadow:0 8px 28px rgba(0,0,0,.28)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.pill{background:rgba(47,123,255,.14);border:1px solid var(--br);color:var(--n);padding:8px 12px;border-radius:99px;font-weight:600;font-size:13px;white-space:nowrap}
.hero{display:flex;align-items:center;gap:16px}.ringw{position:relative;width:150px;height:150px;flex:none}.ringw svg{transform:rotate(-90deg);filter:drop-shadow(0 0 10px rgba(77,163,255,.6))}
.rg{transition:stroke-dasharray 1s cubic-bezier(.2,.8,.2,1)}.rc{position:absolute;inset:0;display:grid;place-content:center;text-align:center}.rc b{font-size:34px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.qs{padding:12px}.qs b{font-size:20px;display:block}.qs span{font-size:20px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.chip{padding:4px 10px;border-radius:99px;font-size:12px;font-weight:700;background:rgba(139,149,171,.18)}.chip.ok{background:rgba(34,197,94,.16);color:var(--g)}.chip.bad{background:rgba(239,68,68,.16);color:var(--r)}.chip.wn{background:rgba(245,158,11,.16);color:var(--o)}
.bar{height:7px;background:rgba(139,149,171,.2);border-radius:9px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;border-radius:9px;transition:width .6s}
.ch1{display:flex;gap:12px;align-items:center;margin-bottom:10px}.ch1 b{font-size:16px}.ic{width:42px;height:42px;border-radius:13px;background:rgba(47,123,255,.15);display:grid;place-items:center;font-size:21px;box-shadow:0 0 14px rgba(47,123,255,.25)}
.in{width:100%;background:var(--bg);color:var(--t);border:1px solid var(--br);border-radius:14px;padding:14px;font:inherit;min-height:50px;outline:0}.in:focus{border-color:var(--b);box-shadow:0 0 0 3px rgba(47,123,255,.25)}.in.bad{border-color:var(--r)}
textarea.in{min-height:96px;resize:vertical;margin-top:8px}textarea.sm{min-height:64px}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:8px}.yn button,.btn{min-height:52px;border-radius:15px;border:1px solid var(--br);background:var(--bg);color:var(--t);font:700 15px inherit;cursor:pointer}
.yn .y.on{background:rgba(34,197,94,.18);border-color:var(--g);color:var(--g)}.yn .n.on{background:rgba(239,68,68,.16);border-color:var(--r);color:var(--r)}
.btn{background:linear-gradient(135deg,var(--b),#00c8ff);border:0;color:#fff;width:100%;box-shadow:0 8px 24px rgba(47,123,255,.45);font-size:16px}.btn.sec{background:var(--c2);color:var(--t);box-shadow:none;border:1px solid var(--br)}.btn.dng{background:transparent;color:var(--r);border:1px solid var(--r);box-shadow:none}
details summary{color:var(--n);cursor:pointer;padding:8px 0;font-weight:600}.sp{width:110px;height:30px}.sp2{display:flex;align-items:center;gap:10px;margin-top:6px}
.ch{width:100%;height:auto;display:block}.tv,.tl{font-size:9px;fill:var(--m)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}.chips button{flex:none;padding:10px 14px;border-radius:99px;border:1px solid var(--br);background:var(--c);color:var(--t);font:600 13px inherit}.chips button.on{background:var(--b);border-color:var(--b)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;background:rgba(14,20,36,0.92);backdrop-filter:blur(16px);border-top:1px solid var(--br);padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px))}
nav button{background:none;border:0;color:var(--m);font:600 11px inherit;display:grid;justify-items:center;gap:2px;min-width:60px;min-height:48px}nav button span{font-size:22px}nav button.on{color:var(--n);text-shadow:0 0 12px var(--b)}
.task{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--br)}.task input[type=checkbox]{width:22px;height:22px;accent-color:var(--b)}.task.d span{text-decoration:line-through;color:var(--m)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.cal div{aspect-ratio:1;border-radius:12px;display:grid;place-items:center;background:var(--c2);font-weight:600;font-size:13px;cursor:pointer}.cal .hd{background:none;aspect-ratio:auto;color:var(--m);font-size:11px;cursor:default}
.cal .s4{background:rgba(34,197,94,.7)}.cal .s3{background:rgba(47,123,255,.75)}.cal .s2{background:rgba(245,158,11,.7)}.cal .s1{background:rgba(239,68,68,.7)}.cal .today{outline:2px solid var(--n)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.7);display:grid;place-items:center;z-index:9;animation:f .3s}.ov div{background:var(--c);border:1px solid var(--g);border-radius:26px;padding:30px 40px;font-size:24px;font-weight:800;color:var(--g);box-shadow:0 0 50px rgba(34,197,94,.4);animation:p .5s}@keyframes f{from{opacity:0}}@keyframes p{from{transform:scale(.6)}}
.ins{padding:10px 0;border-bottom:1px solid var(--br)}.warnbox{border-color:rgba(245,158,11,.4)}.big{font-size:22px;font-weight:800}
</style></head><body><div id="app"></div>
<nav id="nav"></nav>
<script>
const $=s=>document.querySelector(s),P=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+P(d.getMonth()+1)+'-'+P(d.getDate()),pd=s=>{const[a,b,c]=s.split('-');return new Date(+a,b-1,+c)},add=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return iso(d)},TD=()=>iso(new Date());
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let mem={};const ld=(k,f)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):(mem[k]??f)}catch(e){return mem[k]??f}},sv=(k,v)=>{mem[k]=v;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const DEF={net:60,cls:0,study:180,rev:30,smin:420,smax:480,nmin:30,nmax:90,med:5,wo:30,examReq:true,theme:'dark',tg:{name:'Complete my preparation',date:'',prog:0},n:{rev:{on:false,t:'17:00'},exam:{on:false,t:'18:00'},plan:{on:false,t:'21:00'},ref:{on:false,t:'22:00'}}};
let S={...DEF,...ld('dp_s',{})};S.tg={...DEF.tg,...S.tg};S.n={...DEF.n,...S.n};let DAYS=ld('dp_d',{});
const saveS=()=>{sv('dp_s',S);document.documentElement.dataset.theme=S.theme};saveS();
const fmt=m=>{if(m==null||isNaN(m))return'—';m=Math.round(m);const h=Math.floor(m/60),r=m%60;return h?(r?`${h}h ${r}m`:`${h}h`):`${r}m`},fi=m=>m==null?'':fmt(m);
function parse(s){s=String(s).trim().toLowerCase();if(!s)return null;let m=s.match(/^(\d+):(\d{1,2})$/);if(m)return+m[1]*60+ +m[2];m=s.match(/^(?:(\d+(?:\.\d+)?)\s*h(?:ours?|rs?)?)?\s*(?:(\d+)\s*(?:m|min|mins|minutes)?)?$/);if(!m||(m[1]==null&&m[2]==null))return NaN;return Math.round((+m[1]||0)*60+ +(m[2]||0))}
const G=[
{k:'net',i:'📡',t:'Internet Usage',tg:()=>`Target: ≤ ${fmt(S.net)} / day`,use:()=>1,ev(d){const v=d.net;if(v==null)return{p:0,ok:false,l:'Not entered'};return v<=S.net?{p:100,ok:true,l:`Within Limit · ${fmt(v)}`}:{p:Math.max(0,100-(v-S.net)/S.net*100),ok:false,l:`Over Limit · ${fmt(v)}`}}},
{k:'cls',i:'🏫',t:'Class',tg:()=>S.cls?`Target: ${fmt(S.cls)}`:'No target set (Settings)',use:()=>S.cls>0,ev(d){const v=d.cls||0;if(!S.cls)return{p:100,ok:null,l:'Logged '+fmt(v)};const p=Math.min(100,v/S.cls*100);return{p,ok:p>=100,l:p>=100?'Target met':Math.round(p)+'% of target'}}},
{k:'study',i:'📚',t:'Self Study',tg:()=>`Target: ${fmt(S.study)}`,use:()=>S.study>0,ev(d){const v=d.study||0,p=Math.min(100,v/S.study*100);return{p,ok:p>=100,l:p>=100?'Target met':fmt(v)+' studied'}}},
{k:'rev',i:'🔁',t:'Revision',tg:()=>`Minimum: ${fmt(S.rev)}`,use:()=>1,ev(d){const v=d.rev||0,p=Math.min(100,v/S.rev*100);return{p,ok:v>=S.rev,l:v>=S.rev?'Completed · '+fmt(v):'Not completed'}}},
{k:'exam',i:'📝',t:'Daily Exam',tg:()=>"Did you take today's exam?",use:()=>S.examReq,ev(d){const e=d.exam||{};return e.done===true?{p:100,ok:true,l:'Completed'}:{p:0,ok:false,l:e.done===false?'Not completed':'Not answered'}}},
{k:'sleep',i:'🌙',t:'Night Sleep',tg:()=>`Target: ${fmt(S.smin)} – ${fmt(S.smax)}`,use:()=>1,ev(d){const v=d.sleep;if(v==null)return{p:0,ok:false,l:'Not entered'};if(v<S.smin)return{p:v/S.smin*100,ok:false,l:'Insufficient · '+fmt(v)};if(v>S.smax)return{p:85,ok:false,w:1,l:'Above range · '+fmt(v)};return{p:100,ok:true,l:'In range · '+fmt(v)}}},
{k:'nap',i:'😴',t:'Nap',tg:()=>`Preferred: ${fmt(S.nmin)} – ${fmt(S.nmax)}`,use:()=>1,ev(d){const v=d.nap||0;if(v<S.nmin)return{p:v/S.nmin*100,ok:false,l:v?'Too short · '+fmt(v):'No nap'};if(v>S.nmax)return{p:85,ok:false,w:1,l:'Too long · '+fmt(v)};return{p:100,ok:true,l:'In range · '+fmt(v)}}},
{k:'med',i:'🧘',t:'Meditation + Breathing',tg:()=>`Minimum: ${fmt(S.med)}`,use:()=>1,ev(d){const m=d.med||{};if(m.done!==true)return{p:0,ok:false,l:m.done===false?'Not completed':'Not answered'};if(m.min!=null&&m.min<S.med)return{p:m.min/S.med*100,ok:false,l:'Too short · '+fmt(m.min)};return{p:100,ok:true,l:'Completed'+(m.min?' · '+fmt(m.min):'')}}},
{k:'wo',i:'💪',t:'Workout',tg:()=>`Target: ${fmt(S.wo)}`,use:()=>1,ev(d){const w=d.wo||{};return w.done===true?{p:100,ok:true,l:'Completed'+(w.min?' · '+fmt(w.min):'')}:{p:0,ok:false,l:w.done===false?'Not completed':'Not answered'}}}];
const score=d=>{const rs=G.filter(g=>g.use()).map(g=>({g,r:g.ev(d)}));return{pct:Math.round(rs.reduce((a,x)=>a+x.r.p,0)/Math.max(1,rs.length)),done:rs.filter(x=>x.r.ok).length,total:rs.length,rs}};
const V={net:d=>d.net,cls:d=>d.cls,study:d=>d.study,rev:d=>d.rev,sleep:d=>d.sleep,nap:d=>d.nap,med:d=>d.med&&d.med.done?(d.med.min||S.med):0,wo:d=>d.wo&&d.wo.done?(d.wo.min||0):0,exam:d=>d.exam&&d.exam.done?(d.exam.total?Math.round(d.exam.score/d.exam.total*100):100):0};
const series=(k,ds)=>ds.map(x=>DAYS[x]?(V[k](DAYS[x])??0):null),last=n=>Array.from({length:n},(_,i)=>add(TD(),i-n+1)),dl=x=>['Su','Mo','Tu','We','Th','Fr','Sa'][pd(x).getDay()];
const avg=a=>{a=a.filter(v=>v!=null);return a.length?a.reduce((x,y)=>x+y,0)/a.length:null};
const sc=x=>DAYS[x]?(DAYS[x].score??score(DAYS[x]).pct):null;
function streaks(){const ks=Object.keys(DAYS).sort();let b=0,r=0,p=null;ks.forEach(k=>{r=p&&add(p,1)===k?r+1:1;b=Math.max(b,r);p=k});let c=0,d=DAYS[TD()]?TD():add(TD(),-1);while(DAYS[d]){c++;d=add(d,-1)}return{cur:c,best:b}}
const remain=()=>S.tg.date?Math.max(0,Math.ceil((pd(S.tg.date)-pd(TD()))/864e5)):null;
function bars(v,l,f,col,h=110){const n=v.length,w=320,bw=w/n,mx=Math.max(1,...v.map(x=>x||0));let s=`<svg viewBox="0 0 ${w} ${h+22}" class="ch">`;v.forEach((x,i)=>{const bh=x?Math.max(3,x/mx*(h-16)):2,X=i*bw+bw*.15;s+=`<rect x="${X}" y="${h-bh}" width="${bw*.7}" height="${bh}" rx="3" fill="${x==null?'#1b2233':col}"/>`;if(n<=7&&x!=null)s+=`<text x="${i*bw+bw/2}" y="${h-bh-3}" text-anchor="middle" class="tv">${f(x)}</text>`;if(n<=14||i%Math.ceil(n/8)==0)s+=`<text x="${i*bw+bw/2}" y="${h+14}" text-anchor="middle" class="tl">${l[i]}</text>`});return s+'</svg>'}
function line(v,l){const n=v.length,w=320,h=120,pt=v.map((x,i)=>[n>1?10+i*(w-20)/(n-1):w/2,h-(x||0)/100*(h-14)]),pl=pt.map(p=>p.join(',')).join(' ');let s=`<svg viewBox="0 0 ${w} ${h+22}" class="ch"><defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4da3ff" stop-opacity=".45"/><stop offset="1" stop-color="#4da3ff" stop-opacity="0"/></linearGradient></defs>`;[0,50,100].forEach(g=>s+=`<line x1="0" x2="${w}" y1="${h-g/100*(h-14)}" y2="${h-g/100*(h-14)}" stroke="rgba(139,149,171,.2)"/>`);s+=`<polygon points="${pt[0][0]},${h} ${pl} ${pt[n-1][0]},${h}" fill="url(#ag)"/><polyline points="${pl}" fill="none" stroke="#4da3ff" stroke-width="2.5" stroke-linejoin="round" style="filter:drop-shadow(0 0 5px #2f7bff)"/>`;pt.forEach((p,i)=>{if(v[i]!=null){s+=`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="#fff"/>`;if(n<=14)s+=`<text x="${p[0]}" y="${p[1]-8}" text-anchor="middle" class="tv">${v[i]}%</text>`}if(n<=14||i%Math.ceil(n/8)==0)s+=`<text x="${p[0]}" y="${h+14}" text-anchor="middle" class="tl">${l[i]}</text>`});return s+'</svg>'}
const spark=(v,c)=>{const w=110,h=30,m=Math.max(1,...v.map(x=>x||0)),p=v.map((x,i)=>`${i*w/(v.length-1)},${h-2-(x||0)/m*(h-6)}`).join(' ');return`<svg viewBox="0 0 ${w} ${h}" class="sp"><polyline points="${p}" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`};
const ring=(p,sz=150)=>`<div class="ringw" style="width:${sz}px;height:${sz}px"><svg width="${sz}" height="${sz}" viewBox="0 0 120 120"><defs><linearGradient id="rgd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f7bff"/><stop offset="1" stop-color="#00e0ff"/></linearGradient></defs><circle cx="60" cy="60" r="52" fill="none" stroke="rgba(139,149,171,.18)" stroke-width="10"/><circle class="rg" cx="60" cy="60" r="52" fill="none" stroke="url(#rgd)" stroke-width="10" stroke-linecap="round" style="stroke-dasharray:0 327" data-d="${p*3.267} 327"/></svg><div class="rc"><b>${p}%</b><small>today</small></div></div>`;
let view='home',sel=TD(),D={},bad=new Set(),rng=7,cf=TD(),ct=TD(),cm=new Date(),lastFail='';
const clone=o=>JSON.parse(JSON.stringify(o)),blank=d=>({date:d,todo:[],prob:{},note:{}});
const get=p=>p.split('.').reduce((o,k)=>o?.[k],D);function setv(p,v){const a=p.split('.');let o=D;a.slice(0,-1).forEach(k=>o=o[k]??={});o[a.at(-1)]=v;if(view==='daily')live()}
function dur(el){const v=parse(el.value);el.classList.toggle('bad',isNaN(v));isNaN(v)?bad.add(el.dataset.p):bad.delete(el.dataset.p);if(!isNaN(v))setv(el.dataset.p,v)}
function yn(p,v){const y=scrollY;setv(p,v);daily();scrollTo(0,y)}
const NAV=[['home','🏠','Home'],['daily','✍️','Daily'],['progress','📈','Progress'],['calendar','🗓️','Calendar'],['settings','⚙️','Settings']];
function go(v,d){if(d)sel=d;if(v==='daily'){D=clone(DAYS[sel]||blank(sel));D.todo=D.todo||[];D.prob=D.prob||{};bad.clear()}view=v;R();scrollTo(0,0)}
function R(){$('#nav').innerHTML=NAV.map(n=>`<button class="${view===n[0]?'on':''}" onclick="go('${n[0]}')"><span>${n[1]}</span>${n[2]}</button>`).join('');({home,daily,progress,calendar,settings})[view]();setTimeout(()=>document.querySelectorAll('.rg').forEach(e=>e.style.strokeDasharray=e.dataset.d),40)}
const fdate=s=>pd(s).toLocaleDateString(undefined,{weekday:'long'});
function home(){const t=TD(),d=DAYS[t]||blank(t),s=score(d),st=streaks(),rm=remain(),pv=DAYS[add(t,-1)],tasks=pv?pv.todo:[],l7=last(7);
$('#app').innerHTML=`<div class="top"><div><small>TODAY</small><h1>${fdate(t)}</h1><small>${pd(t).toLocaleDateString(undefined,{day:'numeric',month:'long',year:'numeric'})}</small></div><div class="pill">🎯 ${rm==null?'Set target':rm+' days left'}</div></div>
${S.tg.date?`<div class="card" style="margin-top:14px"><div class="row"><b>${esc(S.tg.name)}</b><span class="pill">${S.tg.prog}%</span></div><div class="bar"><i style="width:${S.tg.prog}%;background:var(--b)"></i></div></div>`:''}
<div class="card hero" style="margin-top:14px">${ring(s.pct)}<div><b>Daily Progress</b><div class="big" style="color:var(--n)">${s.done} / ${s.total}</div><small>goals completed</small><small style="margin-top:6px">${s.total-s.done} incomplete</small><small style="margin-top:6px">🔥 Streak ${st.cur} · Target ${rm==null?'—':rm+' days'}</small></div></div>
${DAYS[t]?'':`<div class="card warnbox"><b>Today isn't saved yet</b><small>Complete your review in a few minutes.</small><br><button class="btn" onclick="go('daily',TD())">Start Daily Review</button></div>`}
<div class="grid">${[['net','📡','Internet'],['study','📚','Study'],['sleep','🌙','Sleep'],['rev','🔁','Revision']].map(q=>{const r=G.find(g=>g.k===q[0]).ev(d);return`<div class="card qs"><span>${q[1]}</span><b>${fi(d[q[0]])||'—'}</b><small>${q[2]}</small><div class="bar"><i style="width:${r.p}%;background:${r.ok?'var(--g)':r.w?'var(--o)':'var(--r)'}"></i></div></div>`}).join('')}</div>
<h2>Today's Goals</h2><div class="card">${s.rs.map(x=>`<div class="row" style="padding:8px 0"><span>${x.g.i} ${x.g.t}</span><span class="chip ${x.r.ok?'ok':x.r.ok===null?'':x.r.w?'wn':'bad'}">${x.r.ok?'✓':x.r.ok===null?'•':'✕'}</span></div>`).join('')}</div>
<h2>Last 7 Days</h2><div class="card">${line(l7.map(sc),l7.map(dl))}</div>
<h2>One Good Thing</h2><div class="card">${d.good?esc(d.good):'<small>Nothing written yet today.</small>'}</div>
<h2>Today's To-Do</h2><div class="card">${tasks.length?tasks.map((k,i)=>`<label class="task ${k.done?'d':''}"><input type="checkbox" ${k.done?'checked':''} onchange="tick('${add(t,-1)}',${i})"><span>${esc(k.t)}${k.p?` · ${k.p}`:''}${k.est?` · ${fmt(k.est)}`:''}</span></label>`).join(''):"<small>No tasks planned last night. Plan tomorrow in Daily.</small>"}</div>`}
function tick(dt,i){DAYS[dt].todo[i].done=!DAYS[dt].todo[i].done;sv('dp_d',DAYS);home()}
const di=(p,ph)=>`<input class="in" data-p="${p}" placeholder="${ph||'e.g. 45m, 1h 20m'}" value="${fi(get(p))}" oninput="dur(this)">`;
const ynb=p=>`<div class="yn"><button class="y ${get(p)===true?'on':''}" onclick="yn('${p}',true)">✓ YES</button><button class="n ${get(p)===false?'on':''}" onclick="yn('${p}',false)">✕ NO</button></div>`;
const tx=(p,ph,cls='')=>`<textarea class="in ${cls}" placeholder="${ph}" oninput="setv('${p}',this.value)">${esc(get(p)||'')}</textarea>`;
const ni=(p,ph)=>`<input class="in" type="number" inputmode="decimal" placeholder="${ph}" value="${get(p)??''}" oninput="setv('${p}',this.value===''?null:+this.value)">`;

${[['net','📡 Internet Usage','var(--o)'],['cls','🏫 Class','var(--n)'],['study','📚 Self Study','var(--n)'],['rev','🔁 Revision','var(--g)'],['sleep','🌙 Sleep','var(--b)'],['nap','😴 Nap','var(--n)'],['med','🧘 Meditation','var(--g)'],['wo','💪 Workout','var(--g)'],['exam','📝 Daily Exam (score %)','var(--n)']].map(c=>`<h2>${c[1]}</h2><div class="card">${ds.length?bars(series(c[0],ds),l,c[0]==='exam'?v=>v+'%':fmt,c[2]):''}</div>`).join('')}`}
function calendar(){const y=cm.getFullYear(),m=cm.getMonth(),f=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate();let c=['S','M','T','W','T','F','S'].map(x=>`<div class="hd">${x}</div>`).join('')+'<span></span>'.repeat(f);

const NT={rev:["Revision Reminder","Don't forget your 30-minute revision."],exam:["Daily Exam Reminder","Have you completed today's exam?"],plan:["Tomorrow Planning","Take 5 minutes to prepare tomorrow's To-Do List."],ref:["Daily Reflection","Take a moment to record today's progress."]};
setInterval(()=>{if(!('Notification' in window)||Notification.permission!=='granted')return;const n=new Date(),hm=P(n.getHours())+':'+P(n.getMinutes());Object.keys(NT).forEach(k=>{if(S.n[k].on&&S.n[k].t===hm&&ld('dp_n_'+k)!==TD()){sv('dp_n_'+k,TD());try{new Notification(NT[k][0],{body:NT[k][1]})}catch(e){}}})},30000);
let T=ld('dp_t',{}),AC=null,WL=null;['study','cls'].forEach(k=>T[k]=T[k]||{s:0,a:0,b:0});
